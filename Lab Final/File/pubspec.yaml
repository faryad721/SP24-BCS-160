name: doctor2
description: MediConnect - Doctor & Patient Management App.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.3
  image_picker: ^1.2.1
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_vector_icons: ^2.0.0
  dotted_border: ^2.1.0
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
